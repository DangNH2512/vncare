name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (type-aware)
        run: pnpm exec oxlint --type-aware .

      - name: Typecheck
        run: pnpm exec turbo typecheck

      - name: Unit and e2e tests
        run: pnpm exec turbo test

      - name: Boundary rules (B1-B8)
        run: pnpm exec depcruise packages apps --config .dependency-cruiser.cjs

      - name: i18n keys up to date
        run: |
          node packages/i18n/scripts/generate-keys.mjs
          git diff --exit-code packages/i18n/src/message-keys.ts

  db-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL with schema
        run: docker compose -f docker-compose.local.yml up -d --wait postgres

      - name: RSVP capacity invariant smoke
        run: bash ops/db/smoke/run-smoke.sh
