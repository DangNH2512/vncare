<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Da Nang Connect — Web mockup · Event detail & Create (③)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SHARED BASE for the web-client mockup set. Copy this <style> block
   verbatim into every web mockup file, then append screen-specific CSS
   in a second <style> block. Do not rename shared classes.
   Tokens mirror packages/tokens (what apps/web-client-side ships).
   Doc 10 §12 (teal #0E7C74 + Inter) is a documented drift.
   ===================================================================== */
:root{
  --brand:#0EA5E9; --brand-dark:#0369A1; --sun:#F59E0B;
  --surface:#FFFFFF; --bg:#F8FAFC; --sunken:#F1F5F9; --text:#0F172A; --text-sec:#475569; --text-mut:#64748B; --line:#E2E8F0; --line-strong:#CBD5E1;
  --success:#16A34A; --success-text:#11703A; --warning:#D97706; --warning-text:#8A5A09; --danger:#DC2626; --danger-text:#9C1C14;
  --accent-subtle:#E7F5FD; --success-subtle:#E8F6EE; --warning-subtle:#FBF1E0; --danger-subtle:#FCEAEA; --sun-subtle:#FDF3E1; --info-subtle:#EAF1FB; --info-text:#28558F;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -16px rgba(15,23,42,.18);
  --shadow-2:0 4px 12px rgba(15,23,42,.10);
  --shadow-3:0 12px 32px rgba(15,23,42,.18);
  --side-w:240px; --rail-w:300px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overflow-x:clip}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25}
ul{list-style:none}
:focus-visible{outline:2px solid var(--brand-dark);outline-offset:2px}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Mockup chrome (NOT app UI) ---------- */
.mk-banner{position:sticky;top:0;z-index:95;background:var(--text);color:#fff;font-size:12px;padding:6px 14px;text-align:center}
.mk-banner strong{color:#FCD34D}
.mk-files{display:flex;gap:4px;align-items:center;background:#1E293B;padding:6px 12px;overflow-x:auto}
.mk-files a{flex:0 0 auto;color:#CBD5E1;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}
.mk-files a:hover{background:#334155;color:#fff}
.mk-files a.on{background:#fff;color:var(--text)}
.mk-files .lbl{color:#94A3B8;font-size:11px;font-weight:700;margin-right:6px;flex:0 0 auto}
.mk-toolbar{position:sticky;top:29px;z-index:90;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 12px}
.mk-scrchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px}
.mk-scrchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:5px 10px;font-size:11.5px;font-weight:600;color:var(--text-sec);min-height:44px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.3}
.mk-scrchip b{font-size:9.5px;font-weight:800;letter-spacing:.03em;color:var(--brand-dark);text-transform:uppercase}
.mk-scrchip.on{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.mk-scrchip.on b{color:#BAE6FD}
.mk-toolright{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.seg-lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg-lang button{padding:8px 12px;font-size:12px;font-weight:700;color:var(--text-sec);min-height:36px}
.seg-lang button.on{background:var(--brand-dark);color:#fff}
.mk-notesbtn{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--brand-dark);min-height:36px;white-space:nowrap}
.mk-notesbtn:hover,.mk-notesbtn.on{background:var(--accent-subtle)}
.mk-notes{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-3);z-index:120;transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column}
.mk-notes.open{transform:none}
.mk-notes header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mk-notes header h3{font-size:15px}
.mk-notes .body{padding:16px 18px 40px;overflow-y:auto;font-size:13.5px;color:var(--text-sec)}
.mk-notes .body h4{font-size:13px;color:var(--text);margin:14px 0 6px}
.mk-notes .body h4:first-child{margin-top:0}
.mk-notes .body li{margin:0 0 6px 16px;list-style:disc}
.mk-notes .body code{font-size:12px;background:var(--sunken);padding:1px 5px;border-radius:4px;color:var(--text)}
.mk-notes .drift{background:var(--warning-subtle);color:var(--warning-text);border-radius:var(--r-md);padding:10px 12px;margin-top:10px;font-weight:600}
.mk-mockonly{display:inline-block;font-size:11.5px;color:var(--text-sec);border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:6px 10px}
.mk-mockonly b{color:var(--brand-dark)}

/* ---------- App shell (mirrors apps/web-client-side AppShell) ---------- */
.app{display:flex;max-width:1280px;margin:0 auto;min-height:calc(100vh - 120px)}
.app-side{position:sticky;top:90px;align-self:flex-start;height:calc(100vh - 90px);width:var(--side-w);flex:0 0 auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.app-logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;padding:6px 10px 18px}
.app-logo i{width:10px;height:10px;border-radius:50%;background:var(--brand)}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border-radius:var(--r-md);color:var(--text-sec);font-weight:600;font-size:14.5px;width:100%;text-align:left;position:relative}
.nav-item:hover{background:var(--sunken);color:var(--text)}
.nav-item.on{background:var(--accent-subtle);color:var(--brand-dark);font-weight:700}
.nav-item .ic{width:24px;text-align:center;font-size:18px}
.nav-item .cnt{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.app-create{margin-top:12px}
.app-sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.app-me{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-md)}
.app-me:hover{background:var(--sunken)}
.app-me .meta{min-width:0;font-size:13px;line-height:1.3}
.app-me .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-col{flex:1;min-width:0;display:flex;flex-direction:column}
.app-top{position:sticky;top:90px;z-index:40;height:60px;display:flex;align-items:center;gap:12px;padding:0 24px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.app-search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:40px;color:var(--text-mut);font-size:14px}
.app-search input{border:0;outline:0;background:none;flex:1;min-width:0;min-height:38px}
.app-topright{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px;position:relative;color:var(--text-sec)}
.icon-btn:hover{background:var(--sunken)}
.icon-btn .dot{position:absolute;top:8px;right:8px;min-width:17px;height:17px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.app-body{display:flex;justify-content:center;gap:24px;padding:20px 24px 80px}
.app-main{width:100%;max-width:600px;min-width:0}
.app-rail{width:var(--rail-w);flex:0 0 auto;display:flex;flex-direction:column;gap:16px;position:sticky;top:170px;align-self:flex-start}
.app.wide .app-main{max-width:980px}
.app.wide .app-rail,.app.norail .app-rail{display:none}
.app.bare .app-side,.app.bare .app-top{display:none}
.app.bare .app-main{max-width:1100px}
.app-tabs{display:none}
.rail-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.rail-card h3{font-size:14px;margin-bottom:10px}
.rail-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.rail-row:first-of-type{border-top:0}
.rail-row .grow{flex:1;min-width:0}
.rail-row .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.rail-row .muted{color:var(--text-mut);font-size:12px}
.rail-thumb{width:40px;height:40px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
@media (max-width:1279px){ .app-rail{display:none} }
@media (max-width:1023px){
  :root{--side-w:76px}
  .app-side{padding:14px 8px;align-items:center}
  .app-logo span,.nav-item .lbl,.app-me .meta,.app-create .lbl,.app-sidefoot .seg-lang{display:none}
  .nav-item{justify-content:center;padding:8px}
  .nav-item .cnt{position:absolute;top:4px;right:4px}
  .app-create .btn{width:44px;padding:0}
}
@media (max-width:767px){
  .app-side{display:none}
  .app-top{padding:0 12px}
  .app-body{padding:14px 12px 96px}
  .app-tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .app-tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--text-mut);min-width:56px;min-height:48px;justify-content:center;position:relative}
  .app-tabs button.on{color:var(--brand-dark)}
  .app-tabs .ic{font-size:19px}
  .app-tabs .fab{width:48px;height:48px;border-radius:50%;background:var(--brand-dark);color:#fff;font-size:22px;margin-top:-18px;box-shadow:var(--shadow-2)}
}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;white-space:nowrap;transition:background .12s}
.btn-primary{background:var(--brand-dark);color:#fff}
.btn-primary:hover{background:#02537f}
.btn-outline{border:1px solid var(--line-strong);color:var(--text);background:var(--surface)}
.btn-outline:hover{background:var(--sunken)}
.btn-ghost{color:var(--brand-dark)}
.btn-ghost:hover{background:var(--accent-subtle)}
.btn-success{background:var(--success-subtle);color:var(--success-text);border:1px solid color-mix(in srgb,var(--success) 40%,transparent)}
.btn-warn{background:var(--warning-subtle);color:var(--warning-text);border:1px solid color-mix(in srgb,var(--warning) 40%,transparent)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger-ghost{color:var(--danger-text)}
.btn-danger-ghost:hover{background:var(--danger-subtle)}
.btn:disabled,.btn.disabled{background:var(--sunken);color:var(--text-mut);border-color:var(--line);cursor:not-allowed}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:6px 14px;font-size:13px}

/* ---------- Chips / segmented / tabs ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--text-sec);min-height:40px;white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip.on{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.chip.soft{background:var(--accent-subtle);border-color:color-mix(in srgb,var(--brand) 40%,transparent);color:var(--brand-dark)}
.chip .x{font-weight:800;opacity:.8}
.chip .c{font-size:11.5px;opacity:.75;font-weight:700}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--text-sec);min-height:36px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:12px 14px;font-weight:700;font-size:14px;color:var(--text-mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--brand-dark);border-bottom-color:var(--brand-dark)}
.tabs .cnt{font-size:11.5px;background:var(--sunken);color:var(--text-sec);border-radius:999px;padding:1px 7px;margin-left:6px}

/* ---------- Trust badge (doc 05 §5.3 — canonical T0–T5 ladder) ---------- */
.tb{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.5}
.tb:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.tb.t0{background:var(--sunken);color:var(--text-sec)}
.tb.t1{background:var(--accent-subtle);color:var(--brand-dark)}
.tb.t2{background:#D3EBFA;color:#075985}
.tb.t3{background:var(--brand-dark);color:#fff}
.tb.t4{background:#E0E7FF;color:#3730A3}
.tb.t5{background:var(--sun-subtle);color:#92400E;box-shadow:inset 0 0 0 1px var(--sun)}
.tb.limited{background:var(--danger-subtle);color:var(--danger-text)}

/* ---------- Avatars ---------- */
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;flex:0 0 auto;background:var(--brand-dark)}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:56px;height:56px;font-size:18px}
.av.xl{width:96px;height:96px;font-size:30px}
.avstack{display:inline-flex;align-items:center}
.avstack .av{border:2px solid var(--surface);margin-left:-8px}
.avstack .av:first-child{margin-left:0}
.avstack .more{margin-left:6px;font-size:12.5px;font-weight:700;color:var(--text-sec)}

/* ---------- Event card ---------- */
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.ev:hover{border-color:var(--line-strong)}
.ev-cover{position:relative;aspect-ratio:16/8;display:flex;align-items:center;justify-content:center;font-size:44px}
.ev-cover .tag{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.ev-cover .save{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--shadow-2)}
.ev-cover .save.on{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.94);color:var(--text)}
.pill.src{background:var(--info-subtle);color:var(--info-text)}
.pill.going{background:var(--success);color:#fff}
.pill.wait{background:var(--warning);color:#fff}
.pill.full{background:var(--text);color:#fff}
.pill.cancel{background:var(--danger);color:#fff}
.ev-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ev-when{font-size:12.5px;font-weight:700;color:var(--brand-dark);text-transform:uppercase;letter-spacing:.02em}
.ev-title{font-size:17px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--text-sec)}
.ev-host{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.ev-host b{white-space:nowrap}
.ev-foot{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.ev.row{flex-direction:row}
.ev.row .ev-cover{width:180px;aspect-ratio:auto;flex:0 0 auto;font-size:36px}
.cap{font-size:13px;font-weight:700;color:var(--text)}
.cap.low{color:var(--warning-text)}
.cap.full{color:var(--danger-text)}
.cap-bar{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden;margin-top:4px}
.cap-bar i{display:block;height:100%;background:var(--success)}
.cap-bar.low i{background:var(--warning)}
.cap-bar.full i{background:var(--danger)}
.dgh{position:sticky;top:150px;z-index:5;background:var(--bg);padding:10px 0 8px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--text-mut);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.dgh:after{content:'';flex:1;height:1px;background:var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--text-mut)}
.sec{color:var(--text-sec)}
.h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
.h2{font-size:20px;font-weight:700}
.h3{font-size:16px;font-weight:700}
.small{font-size:13px}
.xs{font-size:12px}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.note{border-radius:var(--r-md);padding:10px 14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;font-weight:600}
.note.info{background:var(--info-subtle);color:var(--info-text)}
.note.warn{background:var(--warning-subtle);color:var(--warning-text)}
.note.danger{background:var(--danger-subtle);color:var(--danger-text)}
.note.ok{background:var(--success-subtle);color:var(--success-text)}
.divider{height:1px;background:var(--line);margin:14px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--text-mut)}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:700;color:var(--text-sec)}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:var(--r-md);padding:10px 12px;min-height:44px;background:var(--surface);width:100%}
.field textarea{min-height:110px;resize:vertical}
.field .hint{font-size:12px;color:var(--text-mut)}
.field.err input{border-color:var(--danger)}
.field .errt{font-size:12px;color:var(--danger-text);font-weight:600}
.check{display:flex;gap:10px;align-items:center;font-size:14px;min-height:40px}
.check input{width:18px;height:18px;accent-color:var(--brand-dark)}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line-strong);flex:0 0 auto;transition:.15s}
.switch:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.switch.on{background:var(--brand-dark)}
.switch.on:after{left:21px}

/* ---------- Table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--bg)}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:48px 24px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-lg)}
.empty .ico{font-size:40px;margin-bottom:10px}

        <!-- ============ W-20 Event detail — 10 viewer-state variants ============ -->
        <section class="scr" data-screen="event" data-code="W-20" data-title="Event detail — member, has spots" data-nav="discover" data-layout="feed">
          <div class="j-detail"></div>
          <template class="notes">
            <h4>Route &amp; render</h4>
            <ul><li><code>/[locale]/events/[slug]</code> · SSR + OG image động (doc 10 §5, W-20)</li>
            <li>Đọc <code>?ev=&lt;id&gt;</code> để đổi sự kiện demo (mặc định <code>volley</code>)</li></ul>
            <h4>Endpoint</h4>
            <ul><li><code>GET /api/v1/occurrences/{occurrenceId}</code> → <code>viewerContext {canRsvp, myRsvpStatus, seatsLeft, requiredTrustLevel}</code> (UC-38)</li>
            <li><code>POST /api/v1/occurrences/{occurrenceId}/rsvps</code> với header <code>Idempotency-Key</code> (UC-38 bước 5)</li></ul>
            <h4>Quy tắc</h4>
            <ul><li>Trạng thái nút RSVP theo bảng doc 10 §7.4 — 8 trạng thái, xem các biến thể <code>event-*</code> khác trong bộ chip phía trên</li>
            <li>Thứ tự khối theo doc 10 §8.3: giờ → địa điểm → ai tham gia → host → mô tả → hỏi đáp → report (không phải thẩm mỹ, là quyết định UX)</li>
            <li>Đây là thành viên T1 (đã xác thực email), <b>chưa</b> RSVP, sự kiện còn chỗ</li></ul>
            <div class="drift">DRIFT: <code>EventResponse</code> thật của <code>apps/api</code> phẳng hoá occurrence sớm nhất của <code>events/{eventId}</code> — mockup mô phỏng đúng 1 occurrence/sự kiện, chưa dựng UI chọn buổi cho sự kiện lặp lại (T-17 chưa làm ở backend).</div>
          </template>
        </section>

        <section class="scr" data-screen="event-guest" data-code="W-20" data-title="Event detail — guest (T0, chưa đăng nhập)" data-nav="discover" data-layout="feed" data-guest="1">
          <div class="j-detail"></div>
          <template class="notes">
            <h4>Ràng buộc Q-01 — guest-first</h4>
            <ul><li>Khách xem được toàn bộ nội dung công khai; chỉ ẩn địa chỉ chính xác và danh sách người tham dự (UC-09, UC-19 hậu điều kiện <code>BR-15</code>)</li>
            <li>Chạm nút RSVP → auth gate <code>M-05</code> → lưu <code>pendingIntent</code> → sau đăng nhập tự thực thi RSVP (UC-38 A-3)</li></ul>
            <h4>Liên kết chéo file</h4>
            <ul><li>Dialog auth gate trong mockup này dẫn sang <code>auth-onboarding-web-mockup.html?screen=gate</code></li></ul>
          </template>
        </section>

        <section class="scr" data-screen="event-going" data-code="W-20" data-title="Event detail — đã RSVP (going)" data-nav="myevents" data-layout="feed">
          <div class="j-detail"></div>
          <template class="notes">
            <h4>Trạng thái</h4>
            <ul><li>Nút chính đổi thành “You are going” — kiểu success nhạt, mở menu quản lý (Cancel · Add to calendar · Invite · My QR) thay vì mở lại sheet RSVP (doc 10 §7.4)</li>
            <li>Địa chỉ chính xác đã mở khoá (<code>BR-15</code>, UC-38 bước 15)</li></ul>
            <h4>Endpoint huỷ</h4>
            <ul><li><code>DELETE /api/v1/occurrences/{occurrenceId}/rsvps</code> tương ứng UC-39, kích hoạt <code>waitlist:promote</code> cho người kế tiếp (UC-40 bước 8)</li></ul>
          </template>
        </section>

        <section class="scr" data-screen="event-waitlist" data-code="W-20" data-title="Event detail — trong waitlist" data-nav="myevents" data-layout="feed">
          <div class="j-detail"></div>
          <template class="notes">
            <h4>M-26 Waitlist status</h4>
            <ul><li>Vị trí hiển thị là số thật, không dùng câu chung chung “You're on the waitlist” (tiêu chí chấp nhận UC-40)</li>
            <li>Endpoint: <code>GET /api/v1/occurrences/{occurrenceId}/waitlist/me</code> trả <code>{position, estimatedChance}</code></li>
            <li>“Typically N of M get in” <b>chỉ hiện khi ≥ 20 lượt thăng hạng lịch sử</b> cùng loại hình (doc 10 §7.5) — mockup này cố tình <b>ẩn</b> số đó để mô phỏng trường hợp chưa đủ dữ liệu</li></ul>
            <div class="drift">DRIFT: backend hiện thăng hạng thẳng sang <code>going</code>, chưa có trạng thái trung gian <code>offered</code> giữ chỗ 12 giờ (T-16 UC-40 bước 11 chưa triển khai) — xem biến thể <code>event-offer</code> để thấy UI kỳ vọng khi có.</div>
          </template>
        </section>

        <section class="scr" data-screen="event-offer" data-code="W-20" data-title="Event detail — được mời từ waitlist (offered)" data-nav="myevents" data-layout="feed">
          <div class="j-detail"></div>
          <template class="notes">
            <h4>UC-40 bước 11–15</h4>
            <ul><li>Cửa sổ xác nhận: 12 giờ nếu còn &gt; 2 giờ tới giờ diễn ra, rút còn 30 phút nếu occurrence bắt đầu trong &lt; 2 giờ</li>
            <li><code>POST /api/v1/rsvps/{rsvpId}/accept-offer</code> · hết hạn thì <code>waitlist:expire-offer</code> đẩy người kế tiếp và đưa người bỏ lỡ về <b>cuối</b> hàng đợi (1 lần), lần 2 thì rời hẳn</li></ul>
          </template>
        </section>

        <section class="scr" data-screen="event-full" data-code="W-20" data-title="Event detail — hết chỗ, không có waitlist" data-nav="discover" data-layout="feed">
          <div class="j-detail"></div>
          <template class="notes">
            <h4>Board Game Night — <code>has_waitlist = false</code></h4>
            <ul><li>Nút RSVP disabled hẳn, kèm 3 gợi ý sự kiện tương tự cùng khu vực/loại hình thay vì để ngõ cụt (doc 10 §7.4 nhánh <code>Q</code> → <code>T</code>)</li>
            <li>Server trả <code>409</code> nếu vẫn cố gọi RSVP mà không có waitlist</li></ul>
          </template>
        </section>

        <section class="scr" data-screen="event-cancelled" data-code="X-04" data-title="Event detail — đã huỷ" data-nav="discover" data-layout="feed">
          <div class="j-detail"></div>
          <template class="notes">
            <h4>UC-23 huỷ hoạt động</h4>
            <ul><li>Banner nêu lý do từ danh mục cố định (Weather · Not enough people · Venue issue · Personal · Other) — organizer chọn khi huỷ, xem dialog Cancel event ở màn <code>event-host</code></li>
            <li>Mọi hành động bị vô hiệu: RSVP, Add to calendar, Share vẫn hiện nhưng không hoạt động</li>
            <li>Người từng <code>going</code>/<code>waitlisted</code> nhận thông báo huỷ (UC-40 A-4); huỷ trong 24 giờ cuối trước giờ diễn ra ghi trust signal âm cho host (doc 05 §5.2)</li></ul>
          </template>
        </section>

            <div class="drift">DRIFT: UC-60 có 14 mã lý do đầy đủ (R-01..R-14) theo mức nghiêm trọng; mockup dùng đúng 8 nhóm rút gọn của doc 10 §7.8 cho UI người dùng cuối — danh mục chi tiết hơn thuộc tầng xử lý của Moderator (AD-30, không thuộc app này).</div>

        <section class="scr" data-screen="review-write" data-code="M-55 · W-55" data-title="Leave a review — dialog mở sẵn" data-nav="myevents" data-layout="feed">
          <div class="j-detail"></div>
          <template class="notes">
            <h4>UC-16 · M-55/W-55 — đánh giá sau hoạt động</h4>
            <ul><li>Chỉ hiện được cho thành viên có <code>rsvps.status = 'checked_in'</code> ở occurrence này; cửa sổ mở từ <code>T+2h</code> sau <code>ends_at</code> tới <code>T+7 ngày</code> (doc 05 §9.2 — mốc double-blind)</li>
            <li>Đánh giá <b>hai chiều</b>: người tham dự chấm host và host cũng chấm người tham dự trong cùng cửa sổ (UC-16); cả hai review bị giữ ở <code>status='pending'</code>, không ai thấy của ai cho tới khi cả hai gửi xong hoặc hết 7 ngày — chống lạm phát điểm và trả đũa (doc 05 §9.1–9.2)</li>
            <li>Chip gợi ý là lối tắt nhập nhanh, không thay thế nhận xét tự do; “Post without my name” chỉ ẩn tên hiển thị, hệ thống vẫn lưu <code>author_user_id</code> thật để kiểm duyệt được (doc 05 §9.4)</li>
            <li>Endpoint: <code>POST /api/v1/occurrences/{occurrenceId}/reviews</code> — service kiểm tra đã <code>checked_in</code>, chưa review occurrence này, <code>rating 1..5</code></li>
            <li>Review ≥ 4★ đã publish sinh <code>trust_signals.positive_review</code> (+3, trần +24 tổng theo loại tín hiệu này — doc 03 §8.5 mục 5, công thức <code>reputation_points</code> doc 05 §5.3)</li></ul>
            <h4>Đề xuất dữ liệu (chưa hiện thực ở <code>apps/api</code>)</h4>
            <ul><li>Bảng tối thiểu: <code>reviews(occurrence_id, reviewer_id, reviewee_id, stars, text, created_at)</code> — bản đầy đủ trong doc 03 §8.5 có thêm <code>target_type/target_id</code> đa hình (user hoặc venue), <code>sub_ratings jsonb</code>, <code>status</code>, <code>is_verified_attendance</code>, <code>helpful_count</code>, <code>moderation_state</code>, ràng buộc UNIQUE một review/người/occurrence</li>
            <li>Kiểm duyệt: review là nội dung người dùng tạo như comment — dùng chung hàng đợi report (UC-60/UC-61), không có luồng duyệt riêng; report trên review dẫn thẳng sang <code>dlgReport</code> giống mọi nơi khác</li></ul>
            <div class="drift">DRIFT: cửa sổ đánh giá lệch giữa hai tài liệu — doc 05 §9.2 (thiết kế double-blind) ghi <b>7 ngày</b>, doc 03 §8.5 (đặc tả cột) ghi <b>14 ngày</b>. Mockup này dùng 7 ngày vì đó là mốc gắn liền với cơ chế an toàn double-blind. UC-16 là <code>Should</code> (doc 02 §10.3), hoãn sang đợt 2 sau MVP — chưa có bảng <code>reviews</code> nào chạy thật trong <code>apps/api</code>.</div>
          </template>
        </section>

            <div class="drift">DRIFT lớn nhất của màn này: <code>apps/web-client-side</code> hiện tại tạo sự kiện bằng <b>một form đơn</b> (khoá i18n <code>event.create.*</code>), chưa phải wizard 4 bước có preview trực tiếp như doc 10 §4.4/§7.6 và mockup này. Đây là gap cần Tech Lead xác nhận trước khi build thật.</div>

const screens = [...document.querySelectorAll('.scr')];
const chips = document.getElementById('mkChips');

  b.innerHTML = `<b>${s.dataset.code||''}</b>${s.dataset.screen}`;
  b.title = s.dataset.title || '';
  b.onclick = () => show(s.dataset.screen, true);
  chips.appendChild(b);
});
const renderHooks = [];            // push(fn) — called after every show() and setLang()
function onRender(fn){ renderHooks.push(fn); }
let CURRENT = null;
function show(id, push){
  const s = screens.find(x => x.dataset.screen === id) || screens[0];
  CURRENT = s.dataset.screen;
  screens.forEach(x => x.classList.toggle('show', x === s));
  chips.querySelectorAll('.mk-scrchip').forEach(c => { const on = c.dataset.target === CURRENT; c.classList.toggle('on', on); if (on) c.scrollIntoView({block:'nearest',inline:'nearest'}); });
  const app = document.getElementById('app');
  app.classList.remove('wide','norail','bare');
  const layout = s.dataset.layout || 'feed';          // feed | wide | norail | bare
  if (layout !== 'feed') app.classList.add(layout);
  const guest = s.dataset.guest === '1';
  document.querySelectorAll('.me-only').forEach(el => el.hidden = guest);
  document.querySelectorAll('.guest-only').forEach(el => el.hidden = !guest);
  document.querySelectorAll('[data-nav]').forEach(n => { if (n.classList.contains('nav-item') || n.closest('.app-tabs')) n.classList.toggle('on', n.dataset.nav === s.dataset.nav); });
  closeAllOverlays();
  renderNotes(s);
  if (push) { const u = new URL(location); u.searchParams.set('screen', CURRENT); history.replaceState(null,'',u); }
  window.scrollTo(0,0);
  runHooks();
}
function runHooks(){ renderHooks.forEach(fn => fn(CURRENT)); applyI18n(); }

/* ---------- i18n ---------- */
function applyI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-area]').forEach(el => el.textContent = area(el.dataset.area));
  document.querySelectorAll('[data-tb]').forEach(el => el.textContent = t('trust.' + el.dataset.tb));
  document.querySelectorAll('.seg-lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
}
function setLang(l, push){
  LANG = l;
  if (push) { const u = new URL(location); u.searchParams.set('lang', l); history.replaceState(null,'',u); }
  runHooks();
}

/* ---------- cross-file navigation ----------
   goTo('screen-id')                         -> screen in this file
   goTo('web-event-mockup.html?screen=x')    -> other file, keeps current language */
const NAV_TARGETS = {
  home:'web-discover-mockup.html?screen=home',
  discover:'web-discover-mockup.html?screen=discover',
  myevents:'web-myspace-mockup.html?screen=my-going',
  notifications:'web-myspace-mockup.html?screen=notifications',
  profile:'web-myspace-mockup.html?screen=profile-me'
};
function goTo(target){
  if (!target) return;
  if (!target.includes('.html')) { show(target, true); return; }
  const [file, q] = target.split('?');
  const sid = new URLSearchParams(q || '').get('screen');
  if (location.pathname.endsWith('/' + file) && sid && screens.some(s => s.dataset.screen === sid)) { show(sid, true); return; }
  location.href = file + '?' + (q ? q + '&' : '') + 'lang=' + LANG;
}

/* ---------- overlays + toast ---------- */
function openOverlay(id){ closeAllOverlays(); const el = document.getElementById(id); if (el) el.hidden = false; }
function closeAllOverlays(){ document.querySelectorAll('[data-overlay]').forEach(o => o.hidden = true); }
document.addEventListener('click', e => {
  if (e.target.matches('[data-overlay]')) closeAllOverlays();          // click on scrim
  const c = e.target.closest('[data-close]'); if (c) closeAllOverlays();
  const o = e.target.closest('[data-open]'); if (o) openOverlay(o.dataset.open);
  const g = e.target.closest('[data-go]'); if (g) goTo(g.dataset.go);
  const n = e.target.closest('[data-nav]'); if (n && (n.classList.contains('nav-item') || n.closest('.app-tabs'))) goTo(NAV_TARGETS[n.dataset.nav]);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllOverlays(); });
let toastTimer;
function toast(msg, action){
  let el = document.getElementById('mkToast');
  if (!el) { el = document.createElement('div'); el.id = 'mkToast'; el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.innerHTML = `<span>${msg}</span>${action ? `<button>${action}</button>` : ''}`;
  el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 3200);
}

/* ---------- boot: call AFTER screen-specific scripts register their hooks ---------- */
function boot(fileKey){
  document.querySelectorAll('.mk-files a').forEach(a => a.classList.toggle('on', a.dataset.file === fileKey));

}

/* ---------------------------------------------------------------------
   Reviews of the host's past sessions (doc 02 UC-16, doc 05 §9). Curated
   listings (foodwalk/lantern/dragon) have no organiser yet, so they show
   an explanatory note instead of an aggregate. Hosts with RATINGS[id]
   === null are new — nobody has checked in to one of their sessions yet.
   --------------------------------------------------------------------- */
function inferReviewDist(avg){
  const weights = [5,4,3,2,1].map(s => 1 / (1 + Math.abs(s - avg) * 2.2));
  const sum = weights.reduce((a,b) => a + b, 0);
  const pct = weights.map(w => Math.round(w / sum * 100));
  pct[0] += 100 - pct.reduce((a,b) => a + b, 0); // keep the bars summing to 100%
  return pct;
}
function reviewDist(id){
  if (REVIEW_DIST[id]) return REVIEW_DIST[id];
  const r = RATINGS[id];
  return r ? inferReviewDist(r.avg) : [0,0,0,0,0];
}

  return `${stepperHTML(4)}
    <div class="card"><h3 class="h3" style="margin-bottom:10px">${t('cr.s4.checklist')}</h3>
      <ul class="checklist">${checks.map(c=>`<li><span class="${c[0]?'ok':'warn'}">${c[0]?'✅':'⚠️'}</span> ${t(c[1])}</li>`).join('')}</ul></div>
    ${wizardNav(4, true)}`;
}
function renderWizard(){
  const step = Number(CURRENT.split('-')[1]);
  const form = document.querySelector('.scr.show .j-wizard .wiz-form');
  const preview = document.querySelector('.scr.show .j-wizard .wiz-preview .prevslot');
  if (!form) return;
  form.innerHTML = ({1:wizStep1,2:wizStep2,3:wizStep3,4:wizStep4})[step]();
  if (preview) preview.innerHTML = eventCard(draftPreviewEvent());
  wireWizardStep(step);
}
function wireWizardStep(step){
  const q = s => document.querySelector(s);
  if (step === 1) {
    q('#dTitle').oninput = e => { DRAFT.title = e.target.value; touchDraft(); renderWizard(); };
    q('#dCatChips').onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; DRAFT.cat = b.dataset.cat; touchDraft(); renderWizard(); };
    q('#dLangChips').onclick = e => { const b = e.target.closest('[data-lang2]'); if (!b) return; const L = b.dataset.lang2; DRAFT.langs = DRAFT.langs.includes(L) ? DRAFT.langs.filter(x=>x!==L) : [...DRAFT.langs, L]; touchDraft(); renderWizard(); };
  } else if (step === 2) {
    q('#dDate').onchange = e => { if (e.target.value) { DRAFT.dateISO = e.target.value; touchDraft(); renderWizard(); } };
    q('#dTime').onchange = e => { DRAFT.time = e.target.value; touchDraft(); renderWizard(); };
    q('#dDuration').onchange = e => { DRAFT.duration = e.target.value; touchDraft(); };
    q('#dAddress').oninput = e => { DRAFT.address = e.target.value; touchDraft(); };
    q('#dArea').onchange = e => { DRAFT.area = e.target.value; touchDraft(); renderWizard(); };
    q('#dRepeatSwitch').onclick = e => { DRAFT.repeat = !DRAFT.repeat; touchDraft(); renderWizard(); };
    q('#dHideExactSwitch').onclick = e => { DRAFT.hideExact = !DRAFT.hideExact; touchDraft(); renderWizard(); };
  } else if (step === 3) {
    q('#dDesc').oninput = e => { DRAFT.description = e.target.value; touchDraft(); q('.hint.num').textContent = DRAFT.description.length+'/30+'; };
    q('#dCapChips').onclick = e => { const b = e.target.closest('[data-cap]'); if (!b) return; DRAFT.capacity = b.dataset.cap === 'nolimit' ? null : Number(b.dataset.cap); touchDraft(); renderWizard(); };
    q('#dWaitlistSwitch').onclick = () => { DRAFT.waitlist = !DRAFT.waitlist; touchDraft(); renderWizard(); };
    q('#dPriceSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; DRAFT.price = b.dataset.price === 'free' ? 0 : (DRAFT.price || 50000); touchDraft(); renderWizard(); };
    q('#dPriceAmount') && (q('#dPriceAmount').oninput = e => { DRAFT.price = Number(e.target.value)||0; touchDraft(); renderWizard(); });
    q('#dFamilySwitch').onclick = () => { DRAFT.familyFriendly = !DRAFT.familyFriendly; touchDraft(); renderWizard(); };
    q('#dAlcoholSwitch').onclick = () => { DRAFT.alcoholFree = !DRAFT.alcoholFree; touchDraft(); renderWizard(); };
    q('#dMinTrust').onchange = e => { DRAFT.minTrust = Number(e.target.value); touchDraft(); };
    q('#dAddQuestion').onclick = () => { if (DRAFT.questions.length<3) DRAFT.questions.push(''); touchDraft(); renderWizard(); };
    document.querySelectorAll('[data-qdel]').forEach(b => b.onclick = () => { DRAFT.questions.splice(Number(b.dataset.qdel),1); touchDraft(); renderWizard(); });
    document.querySelectorAll('[data-qidx]').forEach(inp => inp.oninput = e => { DRAFT.questions[Number(inp.dataset.qidx)] = e.target.value; touchDraft(); });
  } else if (step === 4) {
    q('#wizDraftBtn').onclick = () => { toast(t('cr.draftToast')); goTo('myevents'); };
    q('#wizPublishBtn').onclick = () => { PUBLISH_PENDING = ME.trust < 2; goTo('create-published'); };
  }
}
onRender(id => {
  if (!/^create-[1-4]$/.test(id)) return;
  const root = document.querySelector('.scr.show .j-wizard');
  if (root && !root.dataset.built) { root.innerHTML = `<div class="wiz"><div class="wiz-form"></div><aside class="wiz-preview"><h3>${t('cr.s4.preview')}</h3><div class="prevslot"></div><div class="wiz-autosave" style="margin-top:10px">💾 <span id="wizAutosave">${t('cr.saved',{n:AUTOSAVE_S})}</span></div></aside></div>`; root.dataset.built = '1'; }
  renderWizard();
});

/* ---------- create-published ---------- */
let PUBLISH_PENDING = ME.trust < 2;
function publishedHTML(){
  const pending = PUBLISH_PENDING;
  return `<div class="centerwrap">
    <div class="bigicon">${pending ? '🕓' : '🎉'}</div>
    <span class="pill ${pending?'wait':'going'}">${pending ? t('pub.pending') : t('pub.published')}</span>
    <h1 class="h1">${pending ? t('pub.pendingTitle') : t('pub.liveTitle')}</h1>
    <p class="small sec">${pending ? t('pub.pendingBody') : t('pub.liveBody',{area:area(DRAFT.area)})}</p>
    <div style="width:100%">${eventCard(draftPreviewEvent())}</div>
    <div class="row wrap" style="justify-content:center;gap:10px">
      <button class="btn btn-primary" onclick="toast(t('pub.share'))">${t('pub.share')}</button>
      <button class="btn btn-outline" onclick="toast(t('pub.invite'))">${t('pub.invite')}</button>
      <button class="btn btn-ghost" data-go="event">${t('pub.viewEvent')}</button>
    </div>
    <button class="mk-notesbtn" id="pubToggle">🔁 ${t('pub.viewVariant')}</button>
  </div>`;
}
onRender(id => { if (id !== 'create-published') return; document.querySelector('.j-published').innerHTML = publishedHTML();
  document.getElementById('pubToggle').onclick = () => { PUBLISH_PENDING = !PUBLISH_PENDING; document.querySelector('.j-published').innerHTML = publishedHTML(); document.getElementById('pubToggle').onclick = arguments.callee; };
});

/* ---------- edit (W-34) ---------- */
let EDIT_CRITICAL = false;
function editHTML(){
  const e = ev('volley');
  return `<div class="wiz"><div class="wiz-form">
      <h1 class="h1">${t('edit.title')} · ${e.title}</h1>
      <div class="note warn" id="editWarn" ${EDIT_CRITICAL?'':'hidden'}><span>⚠️</span><span>${t('edit.warn',{n:13})}</span></div>
      <div class="field"><label class="lbl">${t('cr.s1.titleLabel')}</label><input value="${e.title}"></div>
      <div class="field"><label class="lbl">${t('cr.s2.when')}</label>
        <div class="row"><input type="date" id="eDate"><input type="time" id="eTime" value="17:00"></div>
        <span class="hint">ⓘ ${t('cr.s2.tzNote')}</span></div>
      <div class="field"><label class="lbl">${t('cr.s2.address')}</label><input id="eAddress" value="My Khe Beach"></div>
      <div class="field" ${EDIT_CRITICAL?'':'hidden'} id="eNoteField"><label class="lbl">${t('edit.criticalNote')}</label><textarea id="eNote" placeholder="${t('edit.criticalPh')}"></textarea></div>
      <div class="wiz-nav"><a href="#" class="small" style="color:var(--danger-text);font-weight:700" data-open="dlgCancelEvent">${t('edit.cancelLink')}</a><button class="btn btn-primary" id="editSaveBtn">${t('edit.save')}</button></div>
    </div>
    <aside class="wiz-preview"><h3>${t('cr.s4.preview')}</h3>${eventCard(e)}</aside></div>`;
}
onRender(id => { if (id !== 'edit') return; document.querySelector('.j-edit').innerHTML = editHTML();
  const markCritical = () => { EDIT_CRITICAL = true; document.getElementById('editWarn').hidden = false; document.getElementById('eNoteField').hidden = false; };
  document.getElementById('eDate').onchange = markCritical;
  document.getElementById('eTime').onchange = markCritical;
  document.getElementById('eAddress').oninput = markCritical;
  document.getElementById('editSaveBtn').onclick = () => {
    if (EDIT_CRITICAL) {
      if (confirm(t('edit.confirmTitle') + '\\n' + t('edit.confirmBody',{n:13}))) { toast(t('edit.saved',{n:13})); EDIT_CRITICAL = false; }
    } else { toast(t('edit.savedQuiet')); }
  };
});

/* ---------- trust preview toggle + report reasons i18n on every render ---------- */
onRender(() => {
  rpBuildReasons();
  const seg = document.getElementById('trustSeg');
  if (seg) seg.onclick = e => { const b = e.target.closest('[data-trust]'); if (!b) return; TRUST_PREVIEW = b.dataset.trust; renderCurrentDetail(); };
});

/* ---------- localize aria-labels that live on shared-shell elements ----------
   The shared base markup (app shell, .ev card, dialog close buttons) hardcodes
   a few EN aria-labels. We do not edit that shared block; instead we patch the
   attribute at runtime here, keyed by stable structural selectors (classes/ids),
   never by the current label text, so it keeps working after the first patch. */
function patchSharedA11y(){
  document.querySelectorAll('.ev .save, .evd-save').forEach(el => el.setAttribute('aria-label', t('a11y.save')));
  document.querySelectorAll('.evd-share').forEach(el => el.setAttribute('aria-label', t('a11y.share')));
  document.querySelectorAll('.app-search input').forEach(el => el.setAttribute('aria-label', t('a11y.search')));
  document.querySelectorAll('.app-top .icon-btn.me-only').forEach(el => el.setAttribute('aria-label', t('nav.notifications')));
  document.querySelectorAll('.app-tabs .fab').forEach(el => el.setAttribute('aria-label', t('nav.createEvent')));
  document.querySelectorAll('[data-close][aria-label]').forEach(el => el.setAttribute('aria-label', t('a11y.close')));
  const rv = document.getElementById('rvStars'); if (rv) rv.setAttribute('aria-label', t('a11y.rating'));
}
onRender(patchSharedA11y);

/* Tapping a suggested event ("You might also like") opens that event's own detail page, not the
   swipe deck (owner correction 2026-09-19 — swipe is a separate opt-in mode inside Discover). */
document.addEventListener('click', e => {
  if (e.target.closest('.save')) return;
  const card = e.target.closest('.ev[data-ev]');
  if (card) location.href = 'web-event-mockup.html?screen=event&ev=' + card.dataset.ev + '&lang=' + LANG;
});
boot('event');
</script>
