packages:
  - "apps/*"
  - "packages/*"

# Required for React Native: Metro cannot resolve nested symlinked
# dependencies, so packages must be hoisted to a flat node_modules.
nodeLinker: hoisted

allowBuilds:
  # Native binary compilation required for the SWC transform used by vitest.
  '@swc/core': true
  # Analytics/telemetry postinstall; not needed to build.
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - '@next/env@16.3.4'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - next@16.3.4
